# Standard filenames are used for any role without an override.
# Paths are relative to this manifest.
# ocean = Terrain/wOOO.png
# river-delta = Terrain/deltaRivers.pcx
# river-mountain = Terrain/mtnRivers.pcx
# roads = Terrain/roads.pcx
# railroads = Terrain/railroads.png
# Route sheet cells are 128x64 pixels in a 16x16 atlas.
# PCX files default to transparent palette indices 254 and 255.
# Override these per role when a mod uses different palette keys.
# transparent-river-delta = 254,255
# transparent-river-mountain = 254,255
