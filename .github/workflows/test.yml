name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  formatting:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Compile
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --profile ci --all-targets
      - name: Test documentation
        run: cargo test --doc

  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check headless dependencies
        shell: bash
        run: |
          dependencies=$(cargo tree --locked --no-default-features --features scenarios --edges normal --prefix none)
          if grep -E '^(macroquad|miniquad|symphonia|image|image-compare) v' <<< "$dependencies"; then
            exit 1
          fi
      - name: Build and run a headless scenario
        run: |
          cargo build --locked --no-default-features --features scenarios --bin headless_sim
          ./target/debug/headless_sim --scenario city-healing --turns 1 --report "$RUNNER_TEMP/healing.json"

  coverage:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests and print coverage summary
        run: cargo llvm-cov --all-targets
