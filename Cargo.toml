[package]
name = "civcraft"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "civcraft"
path = "src/main.rs"
test = false
required-features = ["desktop-audio"]

[[bin]]
name = "headless_sim"
path = "src/headless_sim.rs"
test = false

[[bin]]
name = "ramp_report"
path = "src/ramp_report.rs"

[dependencies]
serde_json = "1"
bincode = "1.3.3"
macroquad = { version = "0.4.14", default-features = false }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5.5", optional = true, default-features = false, features = ["mp3"] }
toml = "0.8"
lewton = { version = "0.9.4", optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"

[features]
default = ["scenarios"]
# Regression scenarios and their fixtures, run by `headless_sim --scenario`.
# Tests require it.
scenarios = []
desktop-audio = ["macroquad/audio", "dep:symphonia", "dep:lewton"]

[dev-dependencies]
assert_cmd = "2.2"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Simulation searches are CPU-bound; keep debug assertions and symbols while
# reducing the cost of repeated ruleset lookups in unoptimized builds.
[profile.test]
opt-level = 1

