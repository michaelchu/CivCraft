[package]
name = "civcraft"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "civcraft"
path = "src/main.rs"
test = false

[[bin]]
name = "headless_sim"
path = "src/headless_sim.rs"
test = false

[dependencies]
serde_json = "1"
bincode = "1.3.3"
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
image-compare = "0.5"

[dev-dependencies]
assert_cmd = "2.2"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
opt-level = 2
lto = "thin"

# Simulation searches are CPU-bound; keep debug assertions and symbols while
# reducing the cost of repeated ruleset lookups in unoptimized builds.
[profile.test]
opt-level = 1

