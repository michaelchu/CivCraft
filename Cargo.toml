[package]
name = "civcraft"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "headless_sim"
path = "src/headless_sim.rs"

[dependencies]
serde_json = "1"
bincode = "1.3.3"
macroquad = { version = "0.4.14", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3"] }
toml = "0.8"

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release]
opt-level = 2
lto = "thin"

