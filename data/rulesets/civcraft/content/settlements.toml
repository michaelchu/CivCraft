schema_version = 1
source = "CivCraft native settlement rules"

# Native AI archetypes; no foreign-unit aliases.
[barbarians]
basic_unit = "warrior"
advanced_unit = "horseman"
sea_unit = "galley"

[citizens]
# Retained CivCraft conquest extension; not a Civ III unit ability.
partisan_unit = "guerilla"
nationality = true
partisans_pct = 75

[ai]
food_priority = 30
shield_priority = 17
trade_priority = 18
research_priority_percent = 120
no_research_priority = 1
# Favor room for mature cities over the Freeciv default's small-city packing.
growth_priority = 45
growth_potential_deemphasis = 4
preferred_land_tiles_per_city = 14
expansion_cost_priority = 400
free_expansion_cities = 3
growth_food_threshold = 2
perfection = 3
good_enough = 250
discount_period = 24
defense_emphasis = 20
naval_emphasis = 20
# CivCraft extension to Freeciv's wonder city: with no Help Wonder unit a lone
# capital would otherwise become the wonder city and spend dozens of turns on a
# wonder instead of founding its first cities. Fewer cities than this: none.
wonder_city_min_cities = 3
wonder_city_pop_founder_divisor = 5
wonder_city_other_founder_divisor = 2
expansionist_trait_baseline = 50
ferry_cost_divisor = 3
ferry_tech_want = 500

[villages]
barbarian_onset_turn = 60
map_reveal_radius_squared = 30

# Order and weights preserve the campaign's original 14 equally likely rolls.
[[villages.outcomes]]
weight = 1
reward = { kind = "Gold", amount = 25 }

[[villages.outcomes]]
weight = 3
reward = { kind = "Gold", amount = 50 }

[[villages.outcomes]]
weight = 1
reward = { kind = "Gold", amount = 100 }

[[villages.outcomes]]
weight = 3
reward = { kind = "Technology" }

[[villages.outcomes]]
weight = 2
reward = { kind = "Reinforcements" }

[[villages.outcomes]]
weight = 1
reward = { kind = "Barbarians" }

[[villages.outcomes]]
weight = 1
reward = { kind = "Settlement" }

[[villages.outcomes]]
weight = 2
reward = { kind = "Map" }
